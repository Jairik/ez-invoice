{{define "content"}}{{end}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b0b0c">
<meta name="color-scheme" content="dark">
<title>{{.Title}} · ez-invoice</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230b0b0c'/%3E%3Ccircle cx='16' cy='16' r='10' fill='none' stroke='%235f9e6e' stroke-width='1.6'/%3E%3Ctext x='16' y='21' font-family='Georgia,serif' font-size='14' fill='%235f9e6e' text-anchor='middle'%3Ee%3C/text%3E%3C/svg%3E">
<link rel="preload" href="/static/fonts/instrument-serif-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="/static/fonts/geist-mono-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<a class="skip-link" href="#main-content">Skip to content</a>
<div class="app">
  <aside class="rail">
    <span class="rail-mark" aria-hidden="true">e</span>
    <nav class="rail-nav" aria-label="Main navigation">
      <a class="rail-link {{if eq .Active "overview"}}is-active{{end}}" href="/" {{if eq .Active "overview"}}aria-current="page"{{end}}>Overview</a>
      <a class="rail-link {{if eq .Active "time"}}is-active{{end}}" href="/time" {{if eq .Active "time"}}aria-current="page"{{end}}>Time</a>
      <a class="rail-link {{if eq .Active "invoices"}}is-active{{end}}" href="/invoices" {{if eq .Active "invoices"}}aria-current="page"{{end}}>Invoices</a>
      <a class="rail-link {{if eq .Active "presets"}}is-active{{end}}" href="/presets" {{if eq .Active "presets"}}aria-current="page"{{end}}>Presets</a>
      <a class="rail-link {{if eq .Active "settings"}}is-active{{end}}" href="/settings" {{if eq .Active "settings"}}aria-current="page"{{end}}>Settings</a>
    </nav>
    <span class="rail-dot" title="Local app · {{.Config.Currency}}" aria-label="Local app, currency {{.Config.Currency}}"></span>
  </aside>
  <main class="main" id="main-content">
    {{template "content" .}}
  </main>
</div>
{{if .Flash}}<div class="toast {{if .FlashOK}}is-ok{{else}}is-error{{end}}" data-toast role="status" aria-live="polite">{{.Flash}}</div>{{end}}
<script src="/static/app.js"></script>
</body>
</html>
{{define "headActions"}}
<div class="pagehead-actions">
  <a class="btn" href="/time">Log time</a>
  <a class="btn btn-primary" href="/invoices/new">New invoice</a>
</div>
{{end}}
